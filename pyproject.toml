[project]
name = "defiance"
version = "0.1.0"
description = "An early-stage historical project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "flask>=3.1,<3.2",
]

[project.scripts]
defiance = "defiance.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true
