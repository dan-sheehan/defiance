[project]
name = "defiance"
version = "0.1.0"
description = "Deterministic, source-backed questions about the 2017 SDSU baseball season."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "flask>=3.1,<3.2",
    "gunicorn>=26.2,<27",
]

[project.scripts]
defiance = "defiance.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true
