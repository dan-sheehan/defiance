name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.9"
          python-version: "3.12"
          enable-cache: true
      - name: Sync editable installation
        run: uv sync --locked
      - name: Smoke-test editable import and CLI
        run: |
          uv run --no-sync python -c "import defiance; print(defiance.__file__)"
          uv run --no-sync defiance --help
      - name: Sync non-editable installation
        run: uv sync --locked --no-editable --reinstall-package defiance
      - name: Smoke-test installed import and CLI
        run: |
          uv run --no-sync python -c "import defiance; print(defiance.__file__)"
          uv run --no-sync defiance --help
      - name: Run tests
        run: uv run --no-sync python -m unittest discover -s tests
